name: Linux RepoPrompt Server

on:
  pull_request:
    paths:
      - Package.swift
      - Package.resolved
      - Dockerfile.server
      - Sources/RepoPromptAgentRuntimeCore/**
      - Sources/RepoPromptDomainRuntime/**
      - Sources/RepoPromptShared/**
      - Sources/RepoPromptC/**
      - Sources/RepoPromptWorkspaceRuntimeCore/**
      - Sources/RepoPromptHeadlessRuntime/**
      - Sources/RepoPromptServiceProtocol/**
      - Sources/RepoPromptServicePersistence/**
      - Sources/RepoPromptServiceHTTP/**
      - Sources/RepoPromptServerExecutable/**
      - Sources/RepoPromptMCPAdapter/**
      - Tests/RepoPromptServerTests/**
      - Tests/RepoPromptDomainRuntimeTests/**
      - .github/workflows/linux-server.yml
      - Scripts/test_linux_server_container.sh
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  swift:
    name: Ubuntu 24.04 build, migration, auth, SSE, and runtime tests
    runs-on: ubuntu-24.04
    container: swift:6.2.4-noble
    timeout-minutes: 35
    env:
      REPOPROMPT_SERVER_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build RepoPromptServer
        run: swift build --disable-automatic-resolution --product RepoPromptServer
      - name: Run focused server tests
        run: swift test --disable-automatic-resolution --filter RepoPromptServerTests
      - name: Run canonical portable-domain tests
        run: swift test --disable-automatic-resolution --filter RepoPromptDomainRuntimeTests
      - name: Verify server graph excludes UI frameworks
        run: |
          test "$(find Sources/RepoPromptServerExecutable -type f | wc -l)" -eq 1
          ! grep -R -E '^import (AppKit|SwiftUI|Sparkle|Combine)$'             Sources/RepoPromptAgentRuntimeCore             Sources/RepoPromptWorkspaceRuntimeCore             Sources/RepoPromptHeadlessRuntime             Sources/RepoPromptServiceProtocol             Sources/RepoPromptServicePersistence             Sources/RepoPromptServiceHTTP             Sources/RepoPromptServerExecutable             Sources/RepoPromptMCPAdapter
          ! grep -R -E '^import (AppKit|SwiftUI|Sparkle|Combine)$'             Sources/RepoPromptDomainRuntime             Sources/RepoPromptShared

  image:
    name: Canonical non-root image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build --build-arg REPOPROMPT_COMMIT="$GITHUB_SHA" --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" -f Dockerfile.server -t repoprompt-server:test .
      - name: Verify image user and entrypoint
        run: |
          test "$(docker image inspect repoprompt-server:test --format '{{.Config.User}}')" = "65532:65532"
          docker image inspect repoprompt-server:test --format '{{json .Config.Entrypoint}}' | grep -F 'RepoPromptServer'
          test "$(docker image inspect repoprompt-server:test --format '{{index .Config.Labels "org.opencontainers.image.title"}}')" = "RepoPromptServer"
          test "$(docker image inspect repoprompt-server:test --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect repoprompt-server:test --format '{{index .Config.Labels "io.repoprompt.protocol-version"}}')" = "1"
          test "$(docker image inspect repoprompt-server:test --format '{{index .Config.Labels "io.repoprompt.schema-version"}}')" = "6"
          test "$(docker image inspect repoprompt-server:test --format '{{json .Config.ExposedPorts}}')" = '{"9080/tcp":{},"9081/tcp":{},"9443/tcp":{}}'
          docker run --rm --entrypoint /bin/sh repoprompt-server:test -c '
            test "$(id -u)" = 65532 &&
            test -x /usr/local/bin/RepoPromptServer &&
            /opt/repoprompt/providers/codex --version | grep -F 0.147.0 &&
            /opt/repoprompt/providers/claude --version | grep -F 2.1.226 &&
            /opt/repoprompt/providers/opencode --version | grep -F 1.15.11 &&
            /opt/repoprompt/providers/cursor-agent --version | grep -F 2026.08.04-aaa8809'
      - name: Run non-root mTLS, readiness, restart, shutdown, and cleanup checks
        env:
          REPOPROMPT_SERVER_IMAGE: repoprompt-server:test
        run: Scripts/test_linux_server_container.sh
