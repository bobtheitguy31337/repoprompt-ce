[package]
name = "repoprompt-iroh-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "repoprompt_iroh_transport"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
iroh = "=1.0.3"
once_cell = "=1.21.3"
serde_json = "=1.0.145"
thiserror = "=2.0.17"
tokio = { version = "=1.47.1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
uniffi = { version = "=0.31.2", features = ["tokio"] }
zeroize = "=1.9.0"

[dev-dependencies]
tokio = { version = "=1.47.1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
